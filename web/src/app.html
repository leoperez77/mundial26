<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0E1F3F" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Mundial 26" />
		<link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Default OG / Twitter Card — pages can override via svelte:head -->
		<meta property="og:site_name" content="Mundial 26" />
		<meta property="og:title" content="Mundial 26 — Find your sticker" />
		<meta
			property="og:description"
			content="Sticker lookup for the Panini FIFA World Cup 2026™ album."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://mundial26.co/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Mundial 26 — Find your sticker" />
		<meta
			name="twitter:description"
			content="Sticker lookup for the Panini FIFA World Cup 2026™ album."
		/>
		<meta name="twitter:image" content="https://mundial26.co/og.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
