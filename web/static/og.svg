<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0E1F3F"/>

  <!-- Gold-red-gold accent stripe (identity motif §7.6) -->
  <rect x="0" y="0" width="1200" height="14" fill="#D4A537"/>
  <rect x="540" y="0" width="120" height="14" fill="#C42E2E"/>

  <!-- Trophy mark, gold, top-left -->
  <g transform="translate(90 130) scale(3.6)" fill="#D4A537">
    <path d="M7 4h10v2.5a5 5 0 0 1-3.5 4.78V13h1.5a.5.5 0 0 1 .5.5V15h-7v-1.5a.5.5 0 0 1 .5-.5h1.5v-1.72A5 5 0 0 1 7 6.5V4Z"/>
    <path d="M5 5h2v2.5a3.5 3.5 0 0 0 1 2.46A4.5 4.5 0 0 1 5 6V5Z"/>
    <path d="M17 5h2v1a4.5 4.5 0 0 1-3 3.96A3.5 3.5 0 0 0 17 7.5V5Z"/>
    <rect x="7.5" y="17" width="9" height="2"/>
  </g>

  <!-- Eyebrow -->
  <g font-family="JetBrains Mono, monospace" fill="#F0D582" font-weight="700" font-size="22" letter-spacing="6">
    <rect x="90" y="276" width="40" height="3" fill="#D4A537"/>
    <text x="150" y="285">FIND</text>
  </g>

  <!-- Headline, two-line split (navy column on cream would be inverse; here on navy we use cream + gold-light) -->
  <text x="90" y="380" font-family="Anton, sans-serif" font-size="132" fill="#F4F1E8" letter-spacing="-1">TYPE A CODE,</text>
  <text x="90" y="490" font-family="Anton, sans-serif" font-size="132" fill="#D4A537" letter-spacing="-1">FIND THE PAGE.</text>

  <!-- Brand mark, bottom right -->
  <text x="1110" y="570" font-family="Anton, sans-serif" font-size="36" fill="#F4F1E8" text-anchor="end" letter-spacing="2">MUNDIAL 26</text>
  <text x="1110" y="600" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#F4F1E8" opacity="0.6" text-anchor="end" letter-spacing="4">MUNDIAL26.CO</text>

  <!-- Pitch corner arc decoration -->
  <circle cx="1200" cy="630" r="240" fill="none" stroke="#D4A537" stroke-width="6" opacity="0.15"/>
</svg>
