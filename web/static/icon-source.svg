<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Stadium navy background -->
  <rect width="512" height="512" fill="#0E1F3F"/>

  <!-- Gold-red-gold accent stripe (identity motif §7.6) -->
  <rect x="0" y="0" width="512" height="8" fill="#D4A537"/>
  <rect x="230" y="0" width="52" height="8" fill="#C42E2E"/>

  <!-- Trophy mark, gold, centred -->
  <g transform="translate(128 80) scale(11.5)" fill="#D4A537">
    <!-- Cup body -->
    <path d="M7 4h10v2.5a5 5 0 0 1-3.5 4.78V13h1.5a.5.5 0 0 1 .5.5V15h-7v-1.5a.5.5 0 0 1 .5-.5h1.5v-1.72A5 5 0 0 1 7 6.5V4Z"/>
    <!-- Left handle -->
    <path d="M5 5h2v2.5a3.5 3.5 0 0 0 1 2.46A4.5 4.5 0 0 1 5 6V5Z"/>
    <!-- Right handle -->
    <path d="M17 5h2v1a4.5 4.5 0 0 1-3 3.96A3.5 3.5 0 0 0 17 7.5V5Z"/>
    <!-- Base -->
    <rect x="7.5" y="17" width="9" height="2"/>
  </g>

  <!-- Pitch corner arc (identity motif §7.6) -->
  <circle cx="512" cy="512" r="180" fill="none" stroke="#D4A537" stroke-width="6" opacity="0.18"/>
</svg>
